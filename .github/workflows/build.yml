name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Preparar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/CineCasa.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CineCasa
          path: out/CineCasa.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CineCasa 1.0.${{ github.run_number }}
          body: "Descarga directa: https://github.com/${{ github.repository }}/releases/latest/download/CineCasa.apk"
          files: out/CineCasa.apk
          make_latest: true
