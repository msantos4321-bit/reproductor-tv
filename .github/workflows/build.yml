name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'supabase/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Mostrar errores
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Preparar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/CineCasa.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CineCasa
          path: out/CineCasa.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CineCasa 1.0.${{ github.run_number }}
          body: "Descarga directa: https://github.com/${{ github.repository }}/releases/latest/download/CineCasa.apk"
          files: out/CineCasa.apk
          make_latest: true
