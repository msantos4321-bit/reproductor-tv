        else if (kind === 'gift') c.innerHTML = `Sin costo y <b>sin vencimiento</b>. Solo para familia o cortesías.`;
        else c.innerHTML = isMgr() ? `Venta directa tuya. Precio sugerido al público: <b>${money(suggested(n))} al año</b>.`
          : `Gasta <b>${n} ${n == 1 ? 'crédito' : 'créditos'}</b> (tienes ${num(me.credits)}). Precio sugerido al público: <b>${money(suggested(n))} al año</b>.`;
      };
      bg.querySelectorAll('#kind button').forEach(b => b.onclick = () => { kind = b.dataset.k; upd(); });
      bg.querySelector('#m').onclick = () => { n = Math.max(1, n - 1); upd(); };
      bg.querySelector('#p').onclick = () => { n = Math.min(20, n + 1); upd(); };
      bg.querySelector('#go').onclick = async e => {
        e.target.disabled = true;
        try {
          const c = await rpc('cc_code_create', { p_t: token, p_kind: kind, p_devices: n, p_customer: bg.querySelector('#c').value.trim(), p_phone: bg.querySelector('#ph').value.trim(), p_note: '' });
          bg.remove(); await refreshMe(); codeSheet(c, true); if (tab === 'codigos' || tab === 'inicio') render();
        } catch (err) { toast(err.message, 1); e.target.disabled = false; }
      };
      upd();
    });
}

      <a class="btn wa" target="_blank" rel="noopener" href="${waLink(c.phone, inviteText(c))}">Enviar por WhatsApp</a>

    <div class="mailrow"><input type="email" id="em" placeholder="Correo del cliente (opcional)" value="${esc(mailOf(c.code))}" autocomplete="off"><a class="btn" id="ml" href="${mailLink(mailOf(c.code), c)}">Enviar por correo</a></div>

    <div class="btns">
      ${(c.kind !== 'gift' && (c.status === 'vencido' || (d != null && d <= 15))) ? `<a class="btn acc" target="_blank" rel="noopener" href="${waLink(c.phone, renewText(c))}">Recordar renovación</a>` : ''}
    </div>
    <div class="sec">Aparatos</div><div class="group">${devs}</div>
    <div class="sec">Acciones</div>
    <div class="btns">
      ${c.kind === 'trial' && c.status !== 'desactivado' ? `<button class="btn acc" id="conv">Cliente pagó: pasar a anual</button>` : ''}
      ${c.kind === 'paid' ? `<button class="btn acc" id="ren">Renovar 1 año (${c.max} ${c.max == 1 ? 'crédito' : 'créditos'})</button>` : ''}
      ${c.kind === 'paid' ? `<button class="btn" id="ref">Lo recomendó un cliente</button>` : ''}

    </div>

      const act = async (fn, args, msg) => {
        try { const nc = await rpc(fn, Object.assign({ p_t: token, p_code: c.code }, args)); bg.remove(); toast(msg); await refreshMe(); codeSheet(nc); if (tab !== 'reglas') render(); }

      em.oninput = () => { ml.href = mailLink(em.value.trim(), c); saveMail(c.code, em.value.trim()); };
      const conv = bg.querySelector('#conv'); if (conv) conv.onclick = () => askNumber(`¿Cuántos aparatos pagó?`, c.max, n => act('cc_code_convert', { p_devices: n }, 'Ya es anual'), n => isMgr() ? `Venta directa. Sugerido ${money(suggested(n))}` : `Gasta ${n} ${n == 1 ? 'crédito' : 'créditos'} · sugerido ${money(suggested(n))}`);

          <input type="text" id="rc" placeholder="CC-XXXX-XXXX" autocapitalize="characters" style="margin-top:10px;font-family:ui-monospace,Menlo,monospace">

      bg.querySelector('#rev').onclick = () => confirmIn(bg, c.revoked ? '¿Volver a activar este código?' : 'La app dejará de funcionar en sus aparatos la próxima vez que revise. ¿Desactivar?', () => act('cc_code_set', { p_revoked: !c.revoked, p_reset: false, p_customer: null, p_phone: null, p_note: null }, c.revoked ? 'Activado' : 'Desactivado'));

          b2.querySelector('#sv').onclick = async () => {
            try { const nc = await rpc('cc_code_set', { p_t: token, p_code: c.code, p_revoked: null, p_reset: false, p_customer: b2.querySelector('#c').value.trim(), p_phone: b2.querySelector('#ph').value.trim(), p_note: b2.querySelector('#nt').value.trim() }); b2.remove(); toast('Guardado'); codeSheet(nc); if (tab === 'codigos') loadCodes(); }
            catch (e) { toast(e.message, 1); }
          };
        });

}
function confirmIn(bg, msg, ok) {
  const s = bg.querySelector('.sheet'); const box = document.createElement('div');
  box.className = 'cost'; box.style.background = 'rgba(255,69,58,.12)';
  box.innerHTML = `<div>${esc(msg)}</div><div class="btns" style="margin-top:10px"><button class="btn" data-n>Cancelar</button><button class="btn danger" data-y style="background:var(--panel2)">Sí, hacerlo</button></div>`;
  s.appendChild(box); box.scrollIntoView({ behavior: 'smooth' });
  box.querySelector('[data-n]').onclick = () => box.remove(); box.querySelector('[data-y]').onclick = () => { box.remove(); ok(); };
}
function askNumber(title, start, ok, hint) {
  let n = start || 1;
  sheet(`<h2>${esc(title)}</h2><div class="stepper" style="margin:16px 0"><button id="m">−</button><div class="v" id="n">${n}</div><button id="p">＋</button></div><div class="cost" id="h"></div><button class="btn pri full" style="margin-top:16px" id="go">Confirmar</button>`, bg => {
    const upd = () => { bg.querySelector('#n').textContent = n; bg.querySelector('#h').textContent = hint ? hint(n) : ''; };
    bg.querySelector('#m').onclick = () => { n = Math.max(1, n - 1); upd(); };
    bg.querySelector('#p').onclick = () => { n = Math.min(20, n + 1); upd(); };
    bg.querySelector('#go').onclick = () => { bg.remove(); ok(n); };
    upd();
  });
}

function resellerSheet(r) {
  sheet(`<h2>${esc(r.name)}</h2><div class="note" style="margin-top:0">${esc(r.phone || 'Sin WhatsApp')}${r.email ? ' · ' + esc(r.email) : ''}</div>
    <div class="grid" style="margin-top:14px">
      <div class="stat hl"><div class="n">${num(r.credits)}</div><div class="l">Créditos</div></div>
      <div class="stat"><div class="n" style="font-size:20px">${esc(r.level.name)}</div><div class="l">${num(r.level.sold)} aparatos en el año · crédito a ${money(r.level.price)}</div></div>
      <div class="stat"><div class="n">${r.homes}</div><div class="l">Clientes activos</div></div>
      <div class="stat"><div class="n">${r.trials}</div><div class="l">Pruebas en curso</div></div>
    </div>
    <div class="sec">Créditos</div>
    <div class="btns"><button class="btn acc" id="buy">Abonar créditos (me pagó)</button><button class="btn" id="gift">Regalar créditos</button><button class="btn" id="take">Quitar créditos</button></div>
    <div class="sec">Acceso</div>
    <div class="btns"><button class="btn wa" id="acc">Enviar acceso por WhatsApp</button><button class="btn" id="acccp">Copiar enlace de acceso</button></div>
    <div class="note">El enlace sirve una vez y vence en 7 días. Si cambia de celular, mándale otro.</div>
    <div class="sec">Más</div>
    <div class="btns"><button class="btn" id="ed">Editar datos</button><button class="btn" id="mv">Ver movimientos</button><button class="btn danger" id="pz">${r.paused ? 'Quitar pausa' : 'Pausar'}</button></div>
    <div class="note">En pausa no puede crear códigos ni entrar al panel. Sus clientes que ya pagaron siguen funcionando.</div>`, bg => {
      const credit = (title, sign, reason, withAmount) => {
        bg.remove(); let n = 10;
        sheet(`<h2>${title}</h2><label>Créditos</label><div class="stepper"><button id="m">−</button><input type="number" id="n" value="10" min="1" style="width:110px;text-align:center;font-size:22px;font-weight:700"><button id="p">＋</button></div>
          ${withAmount ? `<label>¿Cuánto te pagó? (pesos)</label><input type="number" id="amt" inputmode="decimal">` : ''}
          <div class="note" id="h"></div><button class="btn pri full" style="margin-top:16px" id="go">Confirmar</button>`, b2 => {
            const inp = b2.querySelector('#n'), amt = b2.querySelector('#amt');
            const upd = () => { n = Math.max(1, Number(inp.value) || 1); if (withAmount) { amt.placeholder = 'Sugerido ' + money(n * r.level.price); b2.querySelector('#h').textContent = `Nivel ${r.level.name}: ${money(r.level.price)} por crédito.`; } };
            b2.querySelector('#m').onclick = () => { inp.value = Math.max(1, (Number(inp.value) || 1) - 5); upd(); };
            b2.querySelector('#p').onclick = () => { inp.value = (Number(inp.value) || 0) + 5; upd(); };
            inp.oninput = upd;
            b2.querySelector('#go').onclick = async () => {
              try {
                const v = await rpc('cc_rs_credit', { p_t: token, p_id: r.id, p_delta: sign * n, p_reason: reason, p_amount: withAmount ? (Number(amt.value) || n * r.level.price) : null });
                b2.remove(); toast(`Listo: ahora tiene ${num(v)} créditos`); viewResellers();
              } catch (e) { toast(e.message, 1); }
            };
            upd();
          });
      };
      bg.querySelector('#buy').onclick = () => credit('Abonar créditos', 1, 'compra', true);
      bg.querySelector('#gift').onclick = () => credit('Regalar créditos', 1, 'regalo', false);
      bg.querySelector('#take').onclick = () => credit('Quitar créditos', -1, 'ajuste', false);

      };
      bg.querySelector('#acccp').onclick = async () => { try { copy(await link()); } catch (e) { toast(e.message, 1); } };
      bg.querySelector('#ed').onclick = () => { bg.remove(); editReseller(r); };
      bg.querySelector('#mv').onclick = () => { bg.remove(); ledgerSheet(r); };
      bg.querySelector('#pz').onclick = () => confirmIn(bg, r.paused ? '¿Quitar la pausa?' : '¿Pausar a este distribuidor?', async () => {
        try { await rpc('cc_rs_pause', { p_t: token, p_id: r.id, p_paused: !r.paused }); bg.remove(); toast(r.paused ? 'Pausa quitada' : 'En pausa'); viewResellers(); } catch (e) { toast(e.message, 1); }
      });
    });
}
function editReseller(r) {

      <label for="atd">Días de la prueba automática</label><input type="number" id="atd" value="${esc(r.auto_trial_days || 21)}" min="1">
      <label for="atn">Aparatos de la prueba automática</label><input type="number" id="atn" value="${esc(r.auto_trial_devices || 5)}" min="1" max="10">
      <div class="note">Una sola prueba por aparato. Si escriben el código de quien los recomendó, quedan con el distribuidor de esa persona; si no, son clientes tuyos directos.</div></div>
    <button class="btn pri full" style="margin-top:18px" id="sv">Guardar reglas</button>
    <div class="sec">Clientes con tele Roku</div>
    <div class="stat"><div class="note" style="margin-top:0"><b>No tienes que ir a su casa.</b> El cliente lo hace solo desde su celular Android, en el mismo WiFi que la tele:</div>
      <div class="note">1. Instala CineCasa en su celular (el mismo mensaje de invitación). 2. En el celular: Más → «Instalar CineCasa en una tele Roku». 3. El celular encuentra la tele y le dice qué tocar; la primera vez la tele pide crear una contraseña.</div>
      <div class="note">¿Sin celular Android? Con una computadora Windows en el mismo WiFi: descarga el instalador, descomprímelo y abre «Instalar CineCasa en Roku».</div>
      <div class="btns" style="margin-top:12px"><a class="btn pri" href="../roku/Instalador-CineCasa-Roku.zip" download>Descargar instalador para Roku</a></div></div>
    <div class="sec">Sesión</div><div class="btns"><button class="btn" id="other">Abrir en otro aparato</button><button class="btn danger" id="out">Cerrar sesión</button></div>`;
  $('#sv').onclick = async () => {
    const v = id => Number($('#' + id).value);
    const data = { trial_days: v('td'), trial_devices: v('tdv'), trial_month_cap: v('tcap'), start_credits: v('sc'),
      retail: { d1: v('r1'), d2: v('r2'), d3: v('r3'), extra: v('rx') },
      levels: lv.map((_, i) => ({ name: $('#ln' + i).value.trim(), min: v('lm' + i), price: v('lp' + i) })).sort((a, b) => a.min - b.min),
      manager_whatsapp: $('#mw').value.trim(), downloader_code: $('#dc').value.trim(),
      download_url: $('#du').value.trim(), referral_days: v('rd'), pay_link: $('#pl').value.trim(),
      auto_trial: $('#at').value, auto_trial_days: v('atd'), auto_trial_devices: v('atn') };
    try { const nr = await rpc('cc_rules_set', { p_t: token, p_data: data }); me.rules = nr; toast('Reglas guardadas'); } catch (e) { toast(e.message, 1); }
  };
  $('#other').onclick = async () => {
    try { const t = await rpc('cc_link_create', { p_t: token, p_reseller: null }); const u = PANEL_URL + '#e=' + t;
      sheet(`<h2>Abrir en otro aparato</h2><p class="note">Abre este enlace en tu computadora o tableta en los próximos 10 minutos. Sirve una sola vez.</p><div class="cost" style="word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:13px">${esc(u)}</div><div class="btns" style="margin-top:12px"><button class="btn pri" id="c">Copiar enlace</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(u)}">Mandármelo por WhatsApp</a></div>`, b => b.querySelector('#c').onclick = () => copy(u));
    } catch (e) { toast(e.message, 1); }
  };
  $('#out').onclick = () => logout();
}

// ---------- actualizaciones del panel ----------
// El panel vive en internet: cada vez que se abre trae la versión nueva. Esto cubre el caso
// en que quedó abierto (o instalado en la pantalla de inicio) con una versión vieja.
const LOADED_AT = Date.parse(document.lastModified) || 0;
async function newerVersion() {
  try {
    const r = await fetch(location.pathname + '?chk=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    const lm = Date.parse(r.headers.get('last-modified') || '');
    if (!lm || !LOADED_AT) return null; // no se puede saber
    return lm > LOADED_AT + 1000;
  } catch { return false; }
}
function applyUpdate() { const u = new URL(location.href); u.searchParams.set('u', Date.now()); location.replace(u.toString()); }
function showUpdateBar() {
  if ($('#upd')) return;
  const d = document.createElement('div'); d.id = 'upd'; d.className = 'updbar';
  d.innerHTML = '<span>Hay una versión nueva del panel</span><button class="btn">Actualizar</button>';
  d.querySelector('button').onclick = applyUpdate; document.body.appendChild(d);
}
async function checkUpdate(manual) {
  if (manual) toast('Buscando actualizaciones…');
  const n = await newerVersion();
  if (n === true) { if (manual) applyUpdate(); else showUpdateBar(); }
  else if (manual && n === null) applyUpdate();
  else if (manual) toast(navigator.onLine === false ? 'Sin internet' : 'Ya tienes la versión más nueva');
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(false); });
setTimeout(() => checkUpdate(false), 4000);

window.addEventListener('hashchange', () => { if (/[#&]e=/.test(location.hash)) boot(); });
boot();
</script>
